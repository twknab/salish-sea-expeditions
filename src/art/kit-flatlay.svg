<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 1000" width="700" height="1000">
  <!-- The weekend kit for a night on Jones Island, laid out on a tarp on the beach, in three bands:
       on you, on deck, inside the boat. Item centres match src/content/kit.js. -->
  <defs>
    <linearGradient id="tarp" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e9e2d0"/><stop offset="1" stop-color="#d4cab2"/>
    </linearGradient>
    <pattern id="weave" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M0 4 L8 4 M4 0 L4 8" stroke="#bfb397" stroke-width="0.6" opacity="0.5"/>
    </pattern>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="3" dy="5" stdDeviation="4" flood-color="#3a2f20" flood-opacity="0.35"/>
    </filter>
    <linearGradient id="pfd" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f6c15a"/><stop offset="1" stop-color="#c9852a"/></linearGradient>
    <linearGradient id="alu" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f1f4f5"/><stop offset="1" stop-color="#9aa3a8"/></linearGradient>
    <linearGradient id="bagR" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#e4573d"/><stop offset="1" stop-color="#a8321f"/></linearGradient>
    <linearGradient id="bagB" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3f86c4"/><stop offset="1" stop-color="#245a8a"/></linearGradient>
    <linearGradient id="bagG" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5aa36a"/><stop offset="1" stop-color="#2f6e40"/></linearGradient>
    <linearGradient id="bagY" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f2d016"/><stop offset="1" stop-color="#c6a80c"/></linearGradient>
    <linearGradient id="bagK" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4a5056"/><stop offset="1" stop-color="#1b1e21"/></linearGradient>
  </defs>
  <rect width="700" height="1000" fill="#c9b894"/>
  <rect x="14" y="14" width="672" height="972" rx="10" fill="url(#tarp)"/>
  <rect x="14" y="14" width="672" height="972" rx="10" fill="url(#weave)"/>
  <g fill="#8a7c62"><circle cx="30" cy="30" r="5"/><circle cx="670" cy="30" r="5"/><circle cx="30" cy="970" r="5"/><circle cx="670" cy="970" r="5"/></g>
  <!-- Band dividers -->
  <g stroke="#b5a887" stroke-width="2" stroke-dasharray="8 8"><path d="M40 330 L660 330"/><path d="M40 650 L660 650"/></g>

  <g filter="url(#sh)">
    <!-- ON YOU -->
    <!-- PFD, laid flat -->
    <g transform="translate(130 175)">
      <path d="M-58 -80 L-24 -80 C-20 -50 -8 -36 0 -36 C8 -36 20 -50 24 -80 L58 -80 L66 -40 L70 80 C30 92 -30 92 -70 80 L-66 -40 Z" fill="url(#pfd)"/>
      <path d="M0 -36 L0 86" stroke="#23272b" stroke-width="4"/>
      <g stroke="#23272b" stroke-width="6"><path d="M-70 50 L70 50"/><path d="M-70 68 L70 68"/></g>
      <path d="M-50 -20 L-14 -20 L-14 24 L-50 24 Z" fill="#d18f2e" stroke="#9c5f18" stroke-width="2"/>
      <path d="M14 -20 L50 -20 L50 24 L14 24 Z" fill="#c9852a" stroke="#8a5414" stroke-width="2"/>
      <g fill="#dfe6e8"><rect x="-52" y="-72" width="20" height="6" rx="2"/><rect x="32" y="-72" width="20" height="6" rx="2"/></g>
    </g>
    <!-- Whistle -->
    <g transform="translate(300 115)">
      <path d="M-26 -8 L20 -8 L28 0 L20 12 L-26 12 Z" fill="#e24b2c"/><circle cx="-4" cy="2" r="5" fill="#7b1f10"/>
      <path d="M-26 2 C-50 2 -56 30 -30 34" stroke="#23272b" stroke-width="2.5" fill="none"/>
    </g>
    <!-- Rescue knife in its sheath -->
    <g transform="translate(300 235) rotate(-20)">
      <rect x="-40" y="-10" width="50" height="20" rx="6" fill="#15181b"/>
      <rect x="10" y="-8" width="34" height="16" rx="5" fill="#f2b441"/><circle cx="36" cy="0" r="3" fill="#15181b"/>
    </g>
    <!-- VHF radio -->
    <g transform="translate(455 175)">
      <rect x="-22" y="-44" width="44" height="92" rx="10" fill="#20262a"/>
      <rect x="-12" y="-86" width="10" height="44" rx="4" fill="#15181b"/>
      <rect x="-16" y="-34" width="32" height="22" rx="3" fill="#8fb3a6"/>
      <g fill="#3a4248"><circle cx="-8" cy="4" r="4"/><circle cx="8" cy="4" r="4"/><circle cx="-8" cy="18" r="4"/><circle cx="8" cy="18" r="4"/><circle cx="-8" cy="32" r="4"/><circle cx="8" cy="32" r="4"/></g>
      <text x="0" y="-18" font-family="monospace" font-size="12" text-anchor="middle" fill="#15181b">16</text>
    </g>
    <!-- Headlamp -->
    <g transform="translate(595 175)">
      <ellipse cx="0" cy="0" rx="50" ry="34" fill="none" stroke="#3a4248" stroke-width="8"/>
      <rect x="-20" y="18" width="40" height="28" rx="8" fill="#2b3136"/><circle cx="0" cy="32" r="10" fill="#fff4d6"/><circle cx="0" cy="32" r="6" fill="#ffffff"/>
    </g>

    <!-- ON DECK -->
    <!-- Bilge pump -->
    <g transform="translate(130 430) rotate(-35)">
      <rect x="-70" y="-10" width="120" height="20" rx="8" fill="#e7e2d6"/>
      <rect x="50" y="-6" width="40" height="12" rx="4" fill="#c9cfd2"/>
      <rect x="-86" y="-16" width="16" height="32" rx="4" fill="#f2b441"/>
      <path d="M-40 -10 L-40 10 M-10 -10 L-10 10 M20 -10 L20 10" stroke="#c9c1ae" stroke-width="2"/>
    </g>
    <!-- Paddle float, inflated -->
    <g transform="translate(350 430)">
      <path d="M-70 -34 C-70 -46 -60 -50 -48 -50 L48 -50 C60 -50 70 -46 70 -34 L70 34 C70 46 60 50 48 50 L-48 50 C-60 50 -70 46 -70 34 Z" fill="#f08a24"/>
      <path d="M0 -50 L0 50" stroke="#c46a14" stroke-width="3"/>
      <rect x="-40" y="-20" width="80" height="40" rx="8" fill="none" stroke="#fbd7ae" stroke-width="3" opacity="0.7"/>
      <rect x="-8" y="-60" width="16" height="12" rx="3" fill="#15181b"/>
    </g>
    <!-- Throw bag with its line -->
    <g transform="translate(570 430)">
      <path d="M-30 -40 C-34 0 -34 30 -28 44 C-10 52 10 52 28 44 C34 30 34 0 30 -40 Z" fill="url(#bagY)"/>
      <path d="M-30 -40 C-10 -48 10 -48 30 -40" stroke="#15181b" stroke-width="4" fill="none"/>
      <path d="M0 -46 C10 -70 40 -70 50 -50 C60 -30 40 -20 50 0" stroke="#e24b2c" stroke-width="3" fill="none"/>
      <rect x="-22" y="4" width="44" height="8" fill="#dfe6e8"/>
    </g>
    <!-- Tow belt -->
    <g transform="translate(130 565)">
      <rect x="-70" y="-22" width="120" height="44" rx="14" fill="url(#bagK)"/>
      <path d="M50 -6 L78 -6 L78 6 L50 6 Z" fill="#15181b"/><rect x="72" y="-10" width="14" height="20" rx="3" fill="#e24b2c"/>
      <path d="M-50 22 C-60 50 -20 60 0 40" stroke="#e24b2c" stroke-width="3" fill="none"/>
      <rect x="-10" y="34" width="18" height="10" rx="3" fill="#c9cfd2"/>
    </g>
    <!-- Chart in its clear case, and a compass -->
    <g transform="translate(350 565)">
      <rect x="-72" y="-54" width="120" height="100" rx="6" fill="#dfe9e6" opacity="0.95"/>
      <path d="M-66 -46 L42 -46 L42 38 L-66 38 Z" fill="#cfe0d8"/>
      <path d="M-60 -20 C-40 -30 -20 -16 -10 -24 C4 -34 20 -20 36 -28 L36 38 L-60 38 Z" fill="#e7dcb8"/>
      <path d="M-50 10 C-30 0 -10 16 10 6" stroke="#7fa6b5" stroke-width="1.5" fill="none"/>
      <path d="M-40 -40 L20 20" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4 3"/>
      <circle cx="46" cy="30" r="26" fill="#23272b"/><circle cx="46" cy="30" r="20" fill="#f4f1ea"/>
      <path d="M46 14 L50 30 L46 46 L42 30 Z" fill="#c0392b"/><path d="M46 30 L50 30 L46 46 L42 30 Z" fill="#23272b"/>
    </g>
    <!-- Spare paddle, in halves -->
    <g transform="translate(570 565)">
      <g transform="rotate(-62) scale(0.78)">
        <rect x="-70" y="-26" width="120" height="7" rx="3" fill="#2b2b2b"/>
        <path d="M50 -30 C70 -34 92 -32 100 -22 C92 -14 70 -12 50 -16 Z" fill="#e8e3d4"/>
        <rect x="-70" y="12" width="120" height="7" rx="3" fill="#2b2b2b"/>
        <path d="M-70 8 C-90 4 -112 6 -120 16 C-112 24 -90 26 -70 22 Z" fill="#e8e3d4"/>
      </g>
    </g>

    <!-- INSIDE THE BOAT: dry bags and camp -->
    <!-- Tent: bag, poles out and packed flat -->
    <g transform="translate(130 745)">
      <rect x="-64" y="-26" width="128" height="52" rx="22" fill="url(#bagG)"/>
      <path d="M-40 -26 L-40 26 M40 -26 L40 26" stroke="#1f4a2c" stroke-width="3"/>
      <rect x="-70" y="36" width="140" height="8" rx="4" fill="url(#alu)"/>
    </g>
    <!-- Sleeping bag & pad -->
    <g transform="translate(350 745)">
      <rect x="-60" y="-40" width="80" height="80" rx="30" fill="url(#bagB)"/>
      <path d="M-60 -24 C-40 -30 0 -30 20 -24" stroke="#1b3f63" stroke-width="3" fill="none"/>
      <rect x="30" y="-44" width="34" height="88" rx="16" fill="#4a7a4a"/>
      <path d="M36 -30 L58 -30 M36 -10 L58 -10 M36 10 L58 10 M36 30 L58 30" stroke="#2f5a2f" stroke-width="2"/>
    </g>
    <!-- Food canister and stove -->
    <g transform="translate(570 745)">
      <rect x="-66" y="-44" width="70" height="88" rx="14" fill="#23272b"/>
      <rect x="-66" y="-44" width="70" height="16" rx="6" fill="#3a4046"/>
      <circle cx="42" cy="-6" r="26" fill="url(#alu)"/><circle cx="42" cy="-6" r="18" fill="#6b7378"/>
      <rect x="28" y="24" width="28" height="22" rx="6" fill="#2f7fd6"/>
    </g>
    <!-- Water, 8 litres in bladders -->
    <g transform="translate(130 900)">
      <path d="M-66 -34 C-66 -44 -56 -48 -44 -48 L-8 -48 C4 -48 8 -44 8 -34 L8 34 C8 44 2 48 -8 48 L-44 48 C-56 48 -66 44 -66 34 Z" fill="#9fd0e0" opacity="0.9"/>
      <path d="M-4 -38 C-4 -46 4 -48 16 -48 L52 -48 C64 -48 70 -44 70 -34 L70 34 C70 44 64 48 52 48 L16 48 C4 48 -4 44 -4 34 Z" fill="#8cc3d6" opacity="0.9"/>
      <g fill="#2f5a6a"><rect x="-36" y="-58" width="14" height="12" rx="3"/><rect x="26" y="-58" width="14" height="12" rx="3"/></g>
      <path d="M-56 -20 L-20 -20 M6 -20 L60 -20" stroke="#ffffff" stroke-width="3" opacity="0.6"/>
    </g>
    <!-- Camp clothes in a dry bag -->
    <g transform="translate(350 900)">
      <rect x="-70" y="-30" width="120" height="60" rx="26" fill="url(#bagR)"/>
      <path d="M50 -20 C70 -20 74 20 50 20" stroke="#15181b" stroke-width="5" fill="none"/>
      <rect x="44" y="-6" width="30" height="12" rx="3" fill="#15181b"/>
    </g>
    <!-- First-aid kit -->
    <g transform="translate(570 900)">
      <rect x="-54" y="-38" width="108" height="76" rx="12" fill="#c0392b"/>
      <path d="M-12 -22 L12 -22 L12 -8 L26 -8 L26 14 L12 14 L12 28 L-12 28 L-12 14 L-26 14 L-26 -8 L-12 -8 Z" fill="#ffffff"/>
    </g>
  </g>
</svg>
