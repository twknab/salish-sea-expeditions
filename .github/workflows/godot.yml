# The Godot game's gate: lint, headless unit tests, every scene instantiated headless, the web
# export, and the export opened in headless Chromium as a bare page on a desktop window and on a
# phone (the two profiles the constitution names), with screenshots kept as evidence. Runs on
# pull requests and on main, so a merge is a build somebody could play.
name: Godot
on:
  push:
    branches: [main, experiment/godot-rewrite]
    paths: [godot/**, tests/smoke/godot-*.mjs, server/**, tools/**, src/content/**, .github/workflows/godot.yml]
  pull_request:
    paths: [godot/**, tests/smoke/godot-*.mjs, server/**, tools/**, src/content/**, .github/workflows/godot.yml]
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: godot-${{ github.ref }}
  cancel-in-progress: true
env:
  GODOT_VERSION: 4.5-stable
jobs:
  lint:
    name: GDScript lint and content tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install --quiet "gdtoolkit==4.*"
      - name: gdlint (godot/.gdlintrc)
        working-directory: godot
        run: gdlint scripts tests
      - run: npm ci --no-audit --no-fund
      - name: Content and credits tests (every source id resolves)
        run: npm test
      - name: Generated content is current
        run: |
          node tools/export-content.mjs
          git diff --exit-code -- godot/content || { echo "godot/content is stale: run node tools/export-content.mjs" >&2; exit 1; }
  build:
    name: Tests, export, smoke on desktop and phone
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - name: Cache Godot and web templates
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-web-v1
      - name: Install Godot and the web export templates
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p ~/godot ~/.local/share/godot/export_templates/${GODOT_VERSION/-/.}
          V=$GODOT_VERSION
          curl -sSL -o /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/$V/Godot_v${V}_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot && mv ~/godot/Godot_v${V}_linux.x86_64 ~/godot/godot && chmod +x ~/godot/godot
          curl -sSL -o /tmp/templates.tpz "https://github.com/godotengine/godot/releases/download/$V/Godot_v${V}_export_templates.tpz"
          (cd ~/.local/share/godot/export_templates/${GODOT_VERSION/-/.} && unzip -o -q -j /tmp/templates.tpz 'templates/web_*' 'templates/version.txt')
      - run: npm ci --no-audit --no-fund
      - name: Import
        run: ~/godot/godot --headless --path godot --import || true
      - name: Unit tests
        # A script that errors before quit() leaves Godot running forever; the timeout turns a hang into a failure.
        run: timeout 300 ~/godot/godot --headless --path godot -s res://tests/run_tests.gd
      - name: Every scene instantiates headless
        run: timeout 300 ~/godot/godot --headless --path godot -s res://tests/debug_scenes.gd 2>&1 | tee /tmp/scenes.log; grep -q "scenes ok" /tmp/scenes.log && ! grep -q "SCRIPT ERROR" /tmp/scenes.log
      - name: Export web
        run: mkdir -p build/web && ~/godot/godot --headless --path godot --export-release Web ../build/web/index.html
      - name: The pieces ride beside the pack, fetched after the first frame
        run: mkdir -p build/web/audio && cp godot/audio/piece_*.mp3 build/web/audio/
      - name: Export size
        run: du -h build/web/index.wasm build/web/index.pck | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Install Chromium
        run: npx playwright install chromium --with-deps >/dev/null
      - name: Smoke — the bare page on a desktop window
        run: PORT=4181 OUT=tests/smoke/out/godot-desktop.png node tests/smoke/godot-desktop-shot.mjs build/web
      - name: Smoke — the bare page on a phone
        run: PORT=4182 W=390 H=844 DPR=2 MOBILE=1 OUT=tests/smoke/out/godot-phone.png node tests/smoke/godot-desktop-shot.mjs build/web
      - name: Smoke — on the water
        run: PORT=4183 OUT=tests/smoke/out/godot-trip.png node tests/smoke/godot-desktop-shot.mjs build/web '?scene=trip'
      - name: Smoke — every station from its check URL
        run: PORT=4190 WAIT=12000 node tests/smoke/godot-stations.mjs build/web
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: godot-web, path: "build/web\ntests/smoke/out/godot*.png\ntests/smoke/out/station-*.png", retention-days: 7 }
      - name: The image the deploy would ship builds
        run: docker build -f Dockerfile.godot -t sse-expedition . && docker run --rm -d -p 8080:8080 --name sse sse-expedition && sleep 2 && curl -fsS localhost:8080/health && curl -fsSI localhost:8080/index.wasm | grep -i "application/wasm"; docker rm -f sse >/dev/null 2>&1 || true
