# PRE-MERGE: every pull request that touches the shared JavaScript, the server or the
# infrastructure. Tests (simulation, content, server), a server syntax check, a dependency audit,
# and Terraform format and validation.
#
# The game itself is the Godot project: its gate is the `Godot` workflow, and this one ignores
# `godot/**` so a change there is checked once rather than twice. Actions minutes cost money.
# `workflow_dispatch` runs it by hand.
name: Checks
on:
  pull_request:
    paths-ignore: [godot/**, specs/**, tests/smoke/godot-*.mjs, '**/*.md', .github/workflows/godot.yml]
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    name: Test, server, audit
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # src/content and src/sim are the source the Godot content is generated from
      # (tools/export-content.mjs), so they are still tested here.
      - name: Tests (simulation, content, server)
        run: npm test
      - name: Server syntax
        run: node --check server/server.mjs
      - name: Dependency audit (high and critical)
        run: npm audit --audit-level=high --omit=dev
  terraform:
    name: Terraform fmt and validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive infra
      - name: Validate
        run: |
          for root in infra/bootstrap infra/service; do
            terraform -chdir=$root init -backend=false -input=false
            terraform -chdir=$root validate
          done
