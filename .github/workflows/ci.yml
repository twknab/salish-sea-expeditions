# PRE-MERGE: every pull request that touches the web app, the server or the infrastructure. Tests,
# build, every scene in headless Chromium, server check, audit, Terraform format and validation.
# Not on main after a merge (the pull request already ran it) and not on Godot-only or docs-only
# changes: Actions minutes cost money, so nothing runs twice and nothing runs for a change it
# cannot see. `workflow_dispatch` runs it by hand.
name: Checks
on:
  pull_request:
    paths-ignore: [godot/**, specs/**, tests/smoke/godot-*.mjs, '**/*.md', .github/workflows/godot.yml]
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    name: Test, build, smoke, audit
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tests (simulation, content, server)
        run: npm test
      - name: Build
        run: npm run build
      - name: Server syntax
        run: node --check server/server.mjs
      - name: Smoke — open every scene in headless Chromium
        run: |
          npx playwright install --with-deps chromium
          npm run smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-screenshots
          path: tests/smoke/out/*.png
          retention-days: 7
          if-no-files-found: ignore
      - name: Dependency audit (high and critical)
        run: npm audit --audit-level=high --omit=dev
  terraform:
    name: Terraform fmt and validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive infra
      - name: Validate
        run: |
          for root in infra/bootstrap infra/service; do
            terraform -chdir=$root init -backend=false -input=false
            terraform -chdir=$root validate
          done
